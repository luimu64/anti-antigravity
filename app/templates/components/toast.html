<!-- Toast Notification Container -->
<div id="toast-container" class="toast toast-top toast-center z-50 pointer-events-none" aria-live="polite"></div>

<script>
  // Utility: Toast feedback system
  function showToast(message, type = 'success') {
    const container = document.getElementById('toast-container');
    if (!container) return;

    const alertClass = type === 'error' ? 'alert-error' : 'alert-success';
    const iconSvg = type === 'error'
      ? '<svg xmlns="http://www.w3.org/2000/svg" class="stroke-current shrink-0 h-5 w-5" fill="none" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M10 14l2-2m0 0l2-2m-2 2l-2-2m2 2l2 2m7-2a9 9 0 11-18 0 9 9 0 0118 0z" /></svg>'
      : '<svg xmlns="http://www.w3.org/2000/svg" class="stroke-current shrink-0 h-5 w-5" fill="none" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9 12l2 2 4-4m6 2a9 9 0 11-18 0 9 9 0 0118 0z" /></svg>';

    const toastEl = document.createElement('div');
    toastEl.className = `alert ${alertClass} shadow-lg pointer-events-auto transition-all duration-300`;
    toastEl.innerHTML = `
      ${iconSvg}
      <span>${escapeHtml(message)}</span>
    `;
    container.appendChild(toastEl);

    setTimeout(() => {
      toastEl.classList.add('opacity-0');
      setTimeout(() => toastEl.remove(), 300);
    }, 3000);
  }

  function escapeHtml(str) {
    if (!str) return '';
    return String(str)
      .replace(/&/g, '&amp;')
      .replace(/</g, '&lt;')
      .replace(/>/g, '&gt;')
      .replace(/"/g, '&quot;')
      .replace(/'/g, '&#039;');
  }

  function copyText(text, message = 'Copied to clipboard!') {
    navigator.clipboard.writeText(text);
    showToast(message);
  }
</script>
