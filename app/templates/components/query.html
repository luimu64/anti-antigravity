{% import 'macros/components.html' as ui %}

<!-- Query Widget / Interactive Chat Playground Component -->
{% call ui.section_card('query-card') %}
  <div class="flex items-center justify-between border-b border-base-300 pb-3 mb-4">
    <div class="flex items-center gap-2">
      <h2 class="card-title text-lg font-bold">💬 Query Playground</h2>
      <span id="query-status-badge" class="badge badge-sm badge-neutral">Ready</span>
    </div>
    <div class="flex items-center gap-2">
      <button type="button" onclick="clearQueryOutput()" class="btn btn-ghost btn-xs text-base-content/60 hover:text-base-content" title="Clear response output">Clear Output</button>
    </div>
  </div>

  <form id="query-form" onsubmit="event.preventDefault(); submitQuery();" class="space-y-4">
    <div class="grid grid-cols-1 md:grid-cols-3 gap-3">
      <!-- Model Selector -->
      <div class="form-control md:col-span-2">
        <label class="label py-1" for="query-model-select">
          <span class="label-text text-xs font-semibold">Model</span>
        </label>
        <select id="query-model-select" class="select select-bordered select-sm w-full font-mono text-xs">
          <option value="gemini-2.5-flash">gemini-2.5-flash</option>
          <option value="gemini-3.7-flash-high">gemini-3.7-flash-high</option>
          <option value="claude-sonnet-4-6">claude-sonnet-4-6</option>
        </select>
      </div>

      <!-- Optional API Key input -->
      <div class="form-control">
        <label class="label py-1" for="query-api-key-input">
          <span class="label-text text-xs font-semibold">API Key <span class="text-base-content/50 font-normal">(optional)</span></span>
        </label>
        <input type="password" id="query-api-key-input" placeholder="Bearer sk-gate-..." class="input input-bordered input-sm w-full font-mono text-xs" autocomplete="off">
      </div>
    </div>

    <!-- Prompt input -->
    <div class="form-control">
      <label class="label py-1" for="query-prompt-input">
        <span class="label-text text-xs font-semibold">Prompt</span>
      </label>
      <textarea id="query-prompt-input" rows="3" placeholder="Enter your prompt here (e.g. Write a quick Python hello world function)..." class="textarea textarea-bordered w-full font-mono text-xs focus:textarea-primary leading-relaxed" required></textarea>
    </div>

    <!-- Action Controls -->
    <div class="flex items-center justify-between pt-1">
      <div class="flex items-center gap-2">
        <button type="submit" id="query-submit-btn" class="btn btn-primary btn-sm gap-2">
          <span id="query-submit-text">Send</span>
          <span id="query-spinner" class="loading loading-spinner loading-xs hidden"></span>
        </button>
        <button type="button" id="query-cancel-btn" onclick="abortQuery()" class="btn btn-error btn-outline btn-sm hidden">
          Stop
        </button>
      </div>
      <div class="text-xs text-base-content/50">
        Endpoint: <code class="badge badge-neutral text-xs font-mono">/v1/chat/completions</code>
      </div>
    </div>
  </form>

  <!-- Output Display Container -->
  <div class="mt-4">
    <div class="flex items-center justify-between mb-1.5">
      <span class="text-xs font-semibold text-base-content/70">Response Stream:</span>
      <span id="query-stream-status" class="text-xs font-mono text-base-content/50"></span>
    </div>
    <div id="query-response-container" class="relative">
      <pre id="query-response-output" class="bg-base-100 p-4 rounded-box border border-base-300 font-mono text-xs whitespace-pre-wrap break-words min-h-[100px] max-h-[400px] overflow-y-auto text-base-content/90 selection:bg-primary selection:text-primary-content"><span class="text-base-content/40 italic">Response tokens will stream here in real time...</span></pre>
    </div>
  </div>
{% endcall %}

<script>
  window._queryAbortController = null;

  function populateQueryModels(models) {
    const select = document.getElementById('query-model-select');
    if (!select || !models || models.length === 0) return;

    const currentVal = select.value;
    select.innerHTML = '';
    const addedIds = new Set();

    models.forEach(m => {
      const ids = (m.selectable_model_ids && m.selectable_model_ids.length > 0)
        ? m.selectable_model_ids
        : [m.id || m.model_id];

      ids.forEach(id => {
        if (!id || addedIds.has(id)) return;
        addedIds.add(id);

        const opt = document.createElement('option');
        opt.value = id;
        const dName = m.base_model_name || m.displayName || id;
        opt.textContent = (dName !== id) ? `${dName} (${id})` : id;
        select.appendChild(opt);
      });
    });

    if (currentVal && addedIds.has(currentVal)) {
      select.value = currentVal;
    } else if (addedIds.has('gemini-2.5-flash')) {
      select.value = 'gemini-2.5-flash';
    } else if (addedIds.has('gemini-3.7-flash-high')) {
      select.value = 'gemini-3.7-flash-high';
    }
  }

  async function initQueryWidget() {
    const promptInput = document.getElementById('query-prompt-input');
    if (promptInput) {
      promptInput.addEventListener('keydown', (e) => {
        if ((e.ctrlKey || e.metaKey) && e.key === 'Enter') {
          e.preventDefault();
          submitQuery();
        }
      });
    }

    if (window._allAvailableModels && window._allAvailableModels.length > 0) {
      populateQueryModels(window._allAvailableModels);
    } else {
      try {
        const res = await fetch('/api/models');
        const data = await res.json();
        if (data.models && data.models.length > 0) {
          populateQueryModels(data.models);
        }
      } catch (e) {
        console.warn('Failed to populate query models:', e);
      }
    }
  }

  function renderStreamingOutput(reasoningText, fullText) {
    const outputEl = document.getElementById('query-response-output');
    if (!outputEl) return;

    let html = '';
    if (reasoningText) {
      html += `<span class="text-base-content/50 italic">// Reasoning / Thinking:\n${escapeHtml(reasoningText)}</span>\n\n`;
    }
    if (fullText) {
      html += escapeHtml(fullText);
    }
    outputEl.innerHTML = html || '<span class="text-base-content/40 italic">Waiting for tokens...</span>';
    outputEl.scrollTop = outputEl.scrollHeight;
  }

  async function submitQuery() {
    const promptInput = document.getElementById('query-prompt-input');
    const modelSelect = document.getElementById('query-model-select');
    const apiKeyInput = document.getElementById('query-api-key-input');
    const submitBtn = document.getElementById('query-submit-btn');
    const submitText = document.getElementById('query-submit-text');
    const spinner = document.getElementById('query-spinner');
    const cancelBtn = document.getElementById('query-cancel-btn');
    const outputEl = document.getElementById('query-response-output');
    const statusBadge = document.getElementById('query-status-badge');
    const streamStatus = document.getElementById('query-stream-status');

    const promptText = promptInput ? promptInput.value.trim() : '';
    if (!promptText) {
      showToast('Please enter a prompt', 'error');
      return;
    }

    const selectedModel = modelSelect ? modelSelect.value : 'gemini-2.5-flash';
    let apiKey = apiKeyInput ? apiKeyInput.value.trim() : '';
    if (apiKey.startsWith('Bearer ')) {
      apiKey = apiKey.slice(7).trim();
    }

    // Set active generation state
    if (submitBtn) submitBtn.disabled = true;
    if (submitText) submitText.innerText = 'Generating...';
    if (spinner) spinner.classList.remove('hidden');
    if (cancelBtn) cancelBtn.classList.remove('hidden');
    if (statusBadge) {
      statusBadge.className = 'badge badge-sm badge-primary';
      statusBadge.innerText = 'Streaming';
    }
    if (streamStatus) streamStatus.innerText = 'Connecting...';
    if (outputEl) outputEl.innerHTML = '<span class="text-base-content/40 italic">Connecting to /v1/chat/completions...</span>';

    window._queryAbortController = new AbortController();
    const startTime = performance.now();

    try {
      const headers = { 'Content-Type': 'application/json' };
      if (apiKey) {
        headers['Authorization'] = `Bearer ${apiKey}`;
      }

      const res = await fetch('/v1/chat/completions', {
        method: 'POST',
        headers: headers,
        body: JSON.stringify({
          model: selectedModel,
          messages: [{ role: 'user', content: promptText }],
          stream: true
        }),
        signal: window._queryAbortController.signal
      });

      if (!res.ok) {
        let errorDetail = `HTTP ${res.status} ${res.statusText}`;
        try {
          const errJson = await res.json();
          if (errJson.error && errJson.error.message) {
            errorDetail = errJson.error.message;
          } else if (errJson.detail) {
            errorDetail = (typeof errJson.detail === 'object' && errJson.detail.error?.message)
              ? errJson.detail.error.message
              : String(errJson.detail);
          }
        } catch (e) {
          const errText = await res.text().catch(() => '');
          if (errText) errorDetail = errText;
        }

        if (outputEl) {
          outputEl.innerHTML = `<span class="text-error font-bold">Error (${res.status}):</span> <span class="text-error">${escapeHtml(errorDetail)}</span>`;
        }
        showToast(errorDetail, 'error');
        if (statusBadge) {
          statusBadge.className = 'badge badge-sm badge-error';
          statusBadge.innerText = 'Error';
        }
        if (streamStatus) streamStatus.innerText = `Failed (${res.status})`;
        if (typeof loadHistory === 'function') loadHistory();
        return;
      }

      const reader = res.body.getReader();
      const decoder = new TextDecoder('utf-8');
      let buffer = '';
      let fullText = '';
      let reasoningText = '';
      let tokenCount = 0;

      while (true) {
        const { done, value } = await reader.read();
        if (done) break;

        buffer += decoder.decode(value, { stream: true });
        const lines = buffer.split('\n');
        buffer = lines.pop(); // Retain incomplete line fragment

        for (const line of lines) {
          const trimmed = line.trim();
          if (!trimmed || !trimmed.startsWith('data:')) continue;
          const payload = trimmed.slice(5).trim();
          if (payload === '[DONE]') {
            break;
          }

          try {
            const data = JSON.parse(payload);
            const delta = data.choices?.[0]?.delta;
            if (delta) {
              if (delta.reasoning_content) {
                reasoningText += delta.reasoning_content;
                tokenCount++;
              }
              if (delta.content) {
                fullText += delta.content;
                tokenCount++;
              }
              renderStreamingOutput(reasoningText, fullText);
              const elapsedSec = ((performance.now() - startTime) / 1000).toFixed(1);
              if (streamStatus) {
                streamStatus.innerText = `${tokenCount} tokens (${elapsedSec}s)`;
              }
            }
          } catch (err) {
            // Ignore incomplete chunk JSON errors
          }
        }
      }

      if (statusBadge) {
        statusBadge.className = 'badge badge-sm badge-success';
        statusBadge.innerText = 'Completed';
      }
      const totalSec = ((performance.now() - startTime) / 1000).toFixed(2);
      if (streamStatus) {
        streamStatus.innerText = `${tokenCount} tokens in ${totalSec}s`;
      }
      if (typeof loadHistory === 'function') {
        loadHistory();
      }
    } catch (err) {
      if (err.name === 'AbortError') {
        if (statusBadge) {
          statusBadge.className = 'badge badge-sm badge-warning';
          statusBadge.innerText = 'Cancelled';
        }
        if (streamStatus) streamStatus.innerText = 'Aborted';
        showToast('Generation cancelled');
      } else {
        if (statusBadge) {
          statusBadge.className = 'badge badge-sm badge-error';
          statusBadge.innerText = 'Error';
        }
        if (outputEl) {
          outputEl.innerHTML += `\n<span class="text-error font-bold">Network / Stream Error:</span> <span class="text-error">${escapeHtml(err.message)}</span>`;
        }
        if (streamStatus) streamStatus.innerText = 'Failed';
        showToast('Stream error: ' + err.message, 'error');
      }
      if (typeof loadHistory === 'function') {
        loadHistory();
      }
    } finally {
      window._queryAbortController = null;
      if (submitBtn) submitBtn.disabled = false;
      if (submitText) submitText.innerText = 'Send';
      if (spinner) spinner.classList.add('hidden');
      if (cancelBtn) cancelBtn.classList.add('hidden');
    }
  }

  function abortQuery() {
    if (window._queryAbortController) {
      window._queryAbortController.abort();
    }
  }

  function clearQueryOutput() {
    const outputEl = document.getElementById('query-response-output');
    const statusBadge = document.getElementById('query-status-badge');
    const streamStatus = document.getElementById('query-stream-status');

    if (outputEl) {
      outputEl.innerHTML = '<span class="text-base-content/40 italic">Response tokens will stream here in real time...</span>';
    }
    if (statusBadge) {
      statusBadge.className = 'badge badge-sm badge-neutral';
      statusBadge.innerText = 'Ready';
    }
    if (streamStatus) {
      streamStatus.innerText = '';
    }
  }
</script>
