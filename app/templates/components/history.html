{% import 'macros/components.html' as ui %}

<!-- Query History Widget -->
{% call ui.section_card('history-card') %}
  <div class="flex items-center justify-between border-b border-base-300 pb-3 mb-4">
    <div class="flex items-center gap-2">
      <h2 class="card-title text-lg font-bold">Query History</h2>
      <span id="history-count-badge" class="badge badge-sm badge-neutral">0 queries</span>
      <span id="history-live-indicator" class="flex items-center gap-1.5 text-[11px] font-medium ml-1 text-base-content/50">
        <span id="history-live-dot" class="inline-block w-2 h-2 rounded-full bg-base-content/30"></span>
        <span id="history-live-text">Connecting&hellip;</span>
      </span>
    </div>
    {{ ui.action_button('Clear', 'clearHistory()', variant="btn-outline btn-error btn-xs sm:btn-sm") }}
  </div>

  <div id="history-container" class="overflow-y-auto max-h-96 border border-base-300 rounded-box">
    <div class="p-4">
      {{ ui.loading_placeholder('Loading query history...') }}
    </div>
  </div>
{% endcall %}

<script>
  let _isLoadingHistory = false;

  function updateHistoryBadge(count) {
    const countBadge = document.getElementById('history-count-badge');
    if (countBadge) {
      countBadge.textContent = `${count} ${count === 1 ? 'query' : 'queries'}`;
    }
  }

  // Reflect the realtime connection state in the "Live" pill
  function updateHistoryLiveIndicator(connected) {
    const indicator = document.getElementById('history-live-indicator');
    const dot = document.getElementById('history-live-dot');
    const text = document.getElementById('history-live-text');
    if (!indicator || !dot || !text) return;
    if (connected) {
      indicator.classList.remove('text-warning');
      indicator.classList.add('text-success');
      dot.classList.remove('bg-warning', 'bg-error');
      dot.classList.add('bg-success', 'animate-pulse');
      text.textContent = 'Live';
    } else {
      indicator.classList.remove('text-success');
      indicator.classList.add('text-warning');
      dot.classList.remove('bg-success', 'animate-pulse');
      dot.classList.add('bg-warning');
      text.textContent = 'Offline';
    }
  }

  function historyStatusBadgeClass(q) {
    if (q.status === 'error') return 'badge-error';
    if (q.status === 'stream-aborted' || q.status === 'rate_limited') return 'badge-warning';
    return 'badge-success';
  }

  function historyTimeStr(q) {
    const date = new Date(q.timestamp);
    return isNaN(date.getTime())
      ? q.timestamp
      : date.toLocaleTimeString([], { hour: '2-digit', minute: '2-digit', second: '2-digit' });
  }

  function historyDurationStr(q) {
    return q.duration_ms >= 1000
      ? `${(q.duration_ms / 1000).toFixed(2)}s`
      : `${Math.round(q.duration_ms)}ms`;
  }

  function buildHistoryRowHtml(q) {
    const badgeClass = historyStatusBadgeClass(q);
    const timeStr = historyTimeStr(q);
    const durationStr = historyDurationStr(q);

    let tokenDisplay = '';
    if (q.status === 'error' && !q.total_tokens) {
      tokenDisplay = '<span class="text-xs text-base-content/50">N/A</span>';
    } else {
      const totalFormatted = (q.total_tokens || 0).toLocaleString();
      const promptCount = (q.prompt_tokens || 0).toLocaleString();
      const compCount = (q.completion_tokens || 0).toLocaleString();
      tokenDisplay = `
        <div>
          <span class="font-bold">${totalFormatted}</span>
          <div class="text-[11px] text-base-content/60" title="Prompt: ${promptCount} / Completion: ${compCount}">
            ${promptCount} in / ${compCount} out
          </div>
        </div>
      `;
    }

    const errorHtml = q.error_message
      ? `<div class="text-[11px] text-error truncate max-w-xs" title="${escapeHtml(q.error_message)}">${escapeHtml(q.error_message)}</div>`
      : '';

    const resolvedNote = (q.resolved_model && q.resolved_model !== q.model && q.resolved_model !== 'unknown')
      ? `<div class="text-[11px] text-base-content/60 break-words">&rarr; ${escapeHtml(q.resolved_model)}</div>`
      : '';

    return `
      <tr class="hover" data-entry-id="${escapeHtml(q.id || '')}">
        <td>
          <span class="badge badge-sm ${badgeClass} uppercase font-mono text-[10px]">${escapeHtml(q.status)}</span>
        </td>
        <td class="text-xs text-base-content/70 whitespace-nowrap" title="${escapeHtml(q.timestamp)}">
          ${escapeHtml(timeStr)}
        </td>
        <td>
          <div class="font-bold text-xs break-words min-w-[110px] max-w-[220px]" title="${escapeHtml(q.model)}">${escapeHtml(q.model)}</div>
          ${resolvedNote}
          ${errorHtml}
        </td>
        <td>
          <span class="badge badge-ghost badge-sm font-mono text-xs">${escapeHtml(q.backend || 'antigravity')}</span>
        </td>
        <td class="text-xs font-mono whitespace-nowrap">${escapeHtml(durationStr)}</td>
        <td class="text-xs whitespace-nowrap">${tokenDisplay}</td>
      </tr>
    `;
  }

  // Mobile variant: same data as the table row, collapsed into a tappable card.
  function buildHistoryCardHtml(q) {
    const badgeClass = historyStatusBadgeClass(q);
    const timeStr = historyTimeStr(q);
    const durationStr = historyDurationStr(q);

    const tokensLine = (q.status === 'error' && !q.total_tokens)
      ? '<span class="text-base-content/50">N/A</span>'
      : `<span class="font-bold">${(q.total_tokens || 0).toLocaleString()}</span> `
        + `<span class="text-base-content/60">(${(q.prompt_tokens || 0).toLocaleString()} in / ${(q.completion_tokens || 0).toLocaleString()} out)</span>`;

    const errorBlock = q.error_message
      ? `<div><span class="text-base-content/60">Error</span><div class="text-error break-words">${escapeHtml(q.error_message)}</div></div>`
      : '';

    const resolvedNote = (q.resolved_model && q.resolved_model !== q.model && q.resolved_model !== 'unknown')
      ? `<div><span class="text-base-content/60">Resolved</span> <span class="break-words">&rarr; ${escapeHtml(q.resolved_model)}</span></div>`
      : '';

    return `
      <div class="collapse collapse-arrow bg-base-100 border border-base-300 rounded-box" data-entry-id="${escapeHtml(q.id || '')}">
        <input type="checkbox" aria-label="Expand query entry">
        <div class="collapse-title flex items-center justify-between gap-2 py-3 px-4 min-w-0">
          <div class="flex items-center gap-2 min-w-0">
            <span class="badge badge-sm ${badgeClass} uppercase font-mono text-[10px] shrink-0">${escapeHtml(q.status)}</span>
            <span class="font-bold text-xs truncate">${escapeHtml(q.model)}</span>
          </div>
          <span class="text-[11px] text-base-content/60 shrink-0" title="${escapeHtml(q.timestamp)}">${escapeHtml(timeStr)}</span>
        </div>
        <div class="collapse-content px-4">
          <div class="text-xs space-y-1.5 pb-1">
            ${resolvedNote}
            <div class="flex justify-between gap-3"><span class="text-base-content/60">Backend</span><span class="font-mono truncate">${escapeHtml(q.backend || 'antigravity')}</span></div>
            <div class="flex justify-between gap-3"><span class="text-base-content/60">Latency</span><span class="font-mono">${escapeHtml(durationStr)}</span></div>
            <div class="flex justify-between gap-3"><span class="text-base-content/60 shrink-0">Tokens</span><span class="font-mono text-right">${tokensLine}</span></div>
            ${errorBlock}
          </div>
        </div>
      </div>
    `;
  }

  function renderHistoryTable(history) {
    const container = document.getElementById('history-container');
    if (!container) return;

    updateHistoryBadge(history.length);

    if (history.length === 0) {
      container.innerHTML = '<div class="p-4"><p class="text-xs text-base-content/70">No recent queries recorded yet.</p></div>';
      return;
    }

    container.innerHTML = `
      <!-- Desktop table -->
      <div class="hidden md:block overflow-x-auto">
        <table class="table table-zebra table-sm table-pin-rows w-full">
          <thead>
            <tr class="bg-base-200">
              <th>Status</th>
              <th>Time</th>
              <th>Model</th>
              <th>Backend</th>
              <th>Latency</th>
              <th>Tokens</th>
            </tr>
          </thead>
          <tbody id="history-tbody">
            ${history.map(buildHistoryRowHtml).join('')}
          </tbody>
        </table>
      </div>
      <!-- Mobile expandable cards -->
      <div id="history-cards" class="md:hidden p-2 space-y-2">
        ${history.map(buildHistoryCardHtml).join('')}
      </div>
    `;
  }

  // Clear Query History
  async function clearHistory() {
    try {
      const res = await fetch('/api/history', { method: 'DELETE' });
      if (res.ok) {
        showToast('Query history cleared');
        loadHistory();
      } else {
        showToast('Failed to clear query history', 'error');
      }
    } catch (err) {
      showToast('Error: ' + err.message, 'error');
    }
  }

  // Load Query History (initial load & manual refresh; live updates arrive via WebSocket)
  async function loadHistory() {
    if (_isLoadingHistory) return;
    const container = document.getElementById('history-container');
    if (!container) return;

    _isLoadingHistory = true;
    try {
      const res = await fetch('/api/history');
      const data = await res.json();

      if (!res.ok) {
        container.innerHTML = `<div class="p-4"><p class="text-xs text-error">${escapeHtml(data.error || 'Failed to load history')}</p></div>`;
        return;
      }

      renderHistoryTable(data.history || []);
    } catch (err) {
      container.innerHTML = '<div class="p-4"><p class="text-xs text-error">Failed to load history.</p></div>';
    } finally {
      _isLoadingHistory = false;
    }
  }

  // Prepend a freshly completed request pushed over WebSocket
  function prependHistoryEntry(entry) {
    if (!entry || !entry.id) return;
    const tbody = document.getElementById('history-tbody');
    const cards = document.getElementById('history-cards');

    if (!tbody && !cards) {
      // Neither view rendered yet (empty state) - do a full load instead
      loadHistory();
      return;
    }

    // Skip duplicates (e.g. after a manual refresh race)
    if (tbody && tbody.querySelector(`tr[data-entry-id="${entry.id}"]`)) return;
    if (cards && cards.querySelector(`div[data-entry-id="${entry.id}"]`)) return;

    let count = 0;
    const maxRows = 50;
    if (tbody) {
      tbody.insertAdjacentHTML('afterbegin', buildHistoryRowHtml(entry));
      while (tbody.rows.length > maxRows) tbody.deleteRow(-1);
      count = tbody.rows.length;
    }
    if (cards) {
      cards.insertAdjacentHTML('afterbegin', buildHistoryCardHtml(entry));
      while (cards.children.length > maxRows) cards.lastElementChild.remove();
      count = cards.children.length;
    }

    updateHistoryBadge(count);
  }

  // Reset the view when history is cleared from another session/tab
  function resetHistoryView() {
    renderHistoryTable([]);
  }

  // Live updates via WebSocket (no polling)
  if (window.Realtime) {
    Realtime.on('history.new', prependHistoryEntry);
    Realtime.on('history.clear', resetHistoryView);
    // After a reconnect, fetch anything missed while offline
    Realtime.on('_resync', () => loadHistory());
    Realtime.onStatus(updateHistoryLiveIndicator);
  }
</script>
