version: '3.8'

services:
  agy-to-api:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: agy-to-api
    restart: unless-stopped
    ports:
      - "8000:8000"
    environment:
      - PORT=8000
      - HOST=0.0.0.0
      - API_KEY=
      # Optional: set pre-existing credentials if running headless
      # - REFRESH_TOKEN=
      # - ACCESS_TOKEN=
      # - GOOGLE_PROJECT_ID=
    volumes:
      - ./data:/app/data
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 30s
      timeout: 5s
      retries: 3
