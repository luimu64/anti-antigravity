version: '3.8'

services:
  google-gate:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: google-gate
    restart: unless-stopped
    ports:
      - "8000:8000"
    environment:
      - PORT=8000
      - HOST=0.0.0.0
      - API_KEY=
      # --- AI Studio UI-oracle (Playwright persistent profile) ---
      # Durable Google login state; MUST be a volume or logins evaporate
      # on container recreate.
      - AISTUDIO_ORACLE_PROFILE_DIR=/app/data/aistudio-profile
      # Use the Debian chromium baked into the image (no browser download).
      - AISTUDIO_ORACLE_CHROMIUM=/usr/bin/chromium
      # oracle|http|auto — auto uses the oracle when the profile dir is set.
      - AISTUDIO_WEB_MODE=auto
      # --- Gemini Web live voice (/v1/live, bidiGenerateContent) ---
      # Persistent signed-in profile for the live lane; same requirement as above.
      # Seed it once with scripts/gemini_web_live_login.py (Xvfb + noVNC).
      - GEMINI_WEB_LIVE_PROFILE_DIR=/app/data/gemini-live-profile
      - GEMINI_WEB_LIVE_CHROMIUM=/usr/bin/chromium
      - GEMINI_WEB_LIVE_HEADLESS=1
      - LIVE_ENABLED=true
      # --- Native Live API lane (true full duplex; preferred when configured) ---
      # Set GEMINI_LIVE_API_KEY for key auth, otherwise the signed-in account's
      # OAuth access token is used (the mode the mobile app uses). LIVE_LANE=web
      # forces the cookie lane instead. Empty => falls back to the cookie lane.
      - GEMINI_LIVE_API_KEY=${GEMINI_LIVE_API_KEY:-}
      - GEMINI_LIVE_MODEL=${GEMINI_LIVE_MODEL:-}
      - GEMINI_LIVE_WS_URL=${GEMINI_LIVE_WS_URL:-}
      - LIVE_LANE=${LIVE_LANE:-}
      # Optional: set pre-existing credentials if running headless
      # - REFRESH_TOKEN=
      # - ACCESS_TOKEN=
      # - GOOGLE_PROJECT_ID=
    volumes:
      - ./data:/app/data
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 30s
      timeout: 5s
      retries: 3
