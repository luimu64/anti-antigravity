version: '3.8'

services:
  google-gate:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: google-gate
    restart: unless-stopped
    ports:
      - "8000:8000"
    environment:
      - PORT=8000
      - HOST=0.0.0.0
      - API_KEY=
      # --- AI Studio UI-oracle (Playwright persistent profile) ---
      # Durable Google login state; MUST be a volume or logins evaporate
      # on container recreate.
      - AISTUDIO_ORACLE_PROFILE_DIR=/app/data/aistudio-profile
      # Use the Debian chromium baked into the image (no browser download).
      - AISTUDIO_ORACLE_CHROMIUM=/usr/bin/chromium
      # oracle|http|auto — auto uses the oracle when the profile dir is set.
      - AISTUDIO_WEB_MODE=auto
      # Optional: set pre-existing credentials if running headless
      # - REFRESH_TOKEN=
      # - ACCESS_TOKEN=
      # - GOOGLE_PROJECT_ID=
    volumes:
      - ./data:/app/data
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 30s
      timeout: 5s
      retries: 3
